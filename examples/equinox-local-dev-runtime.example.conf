# Source-checkout developer runtime only. Managed/public installs do not use this file.
# Copy to .equinox-local-dev-runtime.conf and keep that private local file mode 0600.
launchAgentLabel=dev.equinox.local.dev
tunnelRuntime=equinox-local-dev
tunnelClient=/absolute/path/to/equinox-tunnel-client
sourceLauncher=/absolute/path/to/private-source-launcher.sh
