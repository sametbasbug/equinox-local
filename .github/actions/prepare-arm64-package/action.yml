name: Prepare native ARM64 CI package
description: Install locked native dependencies and build and validate the current checkout ARM64 managed ZIP
outputs:
  sha256:
    description: SHA-256 of the prepared managed ZIP
    value: ${{ steps.package.outputs.sha256 }}
  bytes:
    description: Byte length of the prepared managed ZIP
    value: ${{ steps.package.outputs.bytes }}
runs:
  using: composite
  steps:
    - name: Set up native ARM64 Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26.10.0
        architecture: arm64
        cache: npm

    - name: Verify native ARM64 Node host
      shell: pwsh
      run: |
        if ((node -p "process.platform") -ne 'win32') { throw 'ARM64 lane is not running on Windows' }
        if ((node -p "process.arch") -ne 'arm64') { throw 'ARM64 lane is not running native ARM64 Node' }
        if ((node --version) -ne 'v26.10.0') { throw 'ARM64 lane Node version drifted' }

    - name: Install dependencies
      shell: pwsh
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ runner.arch }}-dotnet10-${{ hashFiles('native/windows/**/*.csproj', 'tests/windows/**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-${{ runner.arch }}-dotnet10-

    - name: Publish Windows ARM64 native shell
      shell: pwsh
      run: dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime win-arm64 --self-contained true -p:Platform=ARM64 --output artifacts/windows-shell/win-arm64

    - name: Windows ARM64 native shell publish smoke
      shell: pwsh
      run: |
        $publish = Join-Path $PWD 'artifacts/windows-shell/win-arm64'
        $exe = Join-Path $publish 'EquinoxLocal.exe'
        foreach ($required in @($exe, (Join-Path $publish 'coreclr.dll'), (Join-Path $publish 'hostfxr.dll'), (Join-Path $publish 'Microsoft.Web.WebView2.Core.dll'))) {
          if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing published Windows ARM64 shell component: $required" }
        }
        $bytes = [System.IO.File]::ReadAllBytes($exe)
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
        $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
        if ($machine -ne 0xAA64) { throw ("Published EquinoxLocal.exe is not ARM64 (machine=0x{0:X4})" -f $machine) }
        $loader = Get-ChildItem $publish -Filter WebView2Loader.dll -Recurse | Select-Object -First 1
        if ($null -eq $loader) { throw 'Published ARM64 shell is missing WebView2Loader.dll' }

    - name: Windows ARM64 managed package assembly smoke
      id: package
      shell: pwsh
      env:
        EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: artifacts/windows-shell/win-arm64
      run: |
        npm run local:release:package:windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $artifacts = @(Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-arm64.zip')
        if ($artifacts.Count -ne 1) { throw 'Expected exactly one Windows ARM64 managed ZIP artifact' }
        $artifact = $artifacts[0]
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($artifact.FullName)
        try {
          $names = @($zip.Entries | ForEach-Object FullName)
          foreach ($required in @('release/release.json','release/runtime/node/bin/node.exe','release/runtime/tunnel/tunnel-client.exe','release/runtime/tunnel/cloudflared.exe','release/runtime/browser/equinox-browser-native-host.exe','release/runtime/shell/EquinoxLocal.exe','release/runtime/winapp/winapp.exe','release/runtime/winapp/libHarfBuzzSharp.dll','release/runtime/winapp/libSkiaSharp.dll','release/runtime/winapp/LICENSE')) {
            if ($names -notcontains $required) { throw "Windows ARM64 managed ZIP is missing $required" }
          }
          $entry = $zip.GetEntry('release/release.json')
          $reader = [System.IO.StreamReader]::new($entry.Open())
          try { $metadata = ($reader.ReadToEnd() | ConvertFrom-Json) } finally { $reader.Dispose() }
          if ($metadata.target -ne 'win32-arm64') { throw "Windows ARM64 release metadata target mismatch: $($metadata.target)" }
          if ($names | Where-Object { $_ -like 'release/runtime/peekaboo/*' }) { throw 'Windows ARM64 managed ZIP unexpectedly contains Peekaboo' }
        } finally { $zip.Dispose() }
        $sha256 = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
        "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "bytes=$($artifact.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
