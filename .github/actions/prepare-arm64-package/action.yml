name: Prepare native ARM64 CI package
description: Install locked native dependencies and build and validate the current checkout ARM64 managed ZIP
outputs:
  sha256:
    description: SHA-256 of the prepared managed ZIP
    value: ${{ steps.package.outputs.sha256 }}
  bytes:
    description: Byte length of the prepared managed ZIP
    value: ${{ steps.package.outputs.bytes }}
  version:
    description: Equinox Local version encoded in the prepared managed ZIP
    value: ${{ steps.package.outputs.version }}
  target:
    description: Release target encoded in the prepared managed ZIP
    value: ${{ steps.package.outputs.target }}
  source_sha:
    description: Exact source SHA encoded in the prepared managed ZIP
    value: ${{ steps.package.outputs.source_sha }}
runs:
  using: composite
  steps:
    - name: Set up x64 Node.js for ARM64 cross-package
      uses: actions/setup-node@v7
      with:
        node-version: 26.10.0
        architecture: x64
        cache: npm

    - name: Verify Windows x64 cross-package host
      shell: pwsh
      run: |
        if ((node -p "process.platform") -ne 'win32') { throw 'ARM64 lane is not running on Windows' }
        if ((node -p "process.arch") -ne 'x64') { throw 'ARM64 package producer is not running x64 Node' }
        if ((node --version) -ne 'v26.10.0') { throw 'ARM64 lane Node version drifted' }

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-target-arm64-dotnet10-${{ hashFiles('native/windows/**/*.csproj', 'tests/windows/**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-target-arm64-dotnet10-

    - name: Cache target-native node_modules
      id: node-modules-cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-target-arm64-node26-${{ hashFiles('package-lock.json') }}

    - name: Prepare native package inputs in parallel
      shell: pwsh
      env:
        PREPARE_INPUTS_SCRIPT: ${{ github.action_path }}/prepare-inputs.ps1
        EQUINOX_NODE_MODULES_CACHE_HIT: ${{ steps.node-modules-cache.outputs.cache-hit }}
      run: '& $env:PREPARE_INPUTS_SCRIPT'

    - name: Shape target ARM64 node-pty payload
      shell: pwsh
      run: |
        $nodePtyRoot = Join-Path $PWD 'node_modules\node-pty'
        $nodePtyBuild = Join-Path $nodePtyRoot 'build'
        if (Test-Path -LiteralPath $nodePtyBuild) { Remove-Item -LiteralPath $nodePtyBuild -Recurse -Force }
        foreach ($required in @('prebuilds\win32-arm64\conpty.node', 'prebuilds\win32-arm64\conpty_console_list.node')) {
          if (-not (Test-Path -LiteralPath (Join-Path $nodePtyRoot $required) -PathType Leaf)) { throw "ARM64 node-pty prebuild is missing: $required" }
        }

    - name: Windows ARM64 native shell publish smoke
      shell: pwsh
      env:
        EQUINOX_ARM64_SHELL_PUBLISH_DIR: ${{ runner.temp }}/windows-shell/win-arm64
      run: |
        $publish = $env:EQUINOX_ARM64_SHELL_PUBLISH_DIR
        $exe = Join-Path $publish 'EquinoxLocal.exe'
        foreach ($required in @($exe, (Join-Path $publish 'coreclr.dll'), (Join-Path $publish 'hostfxr.dll'), (Join-Path $publish 'Microsoft.Web.WebView2.Core.dll'))) {
          if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing published Windows ARM64 shell component: $required" }
        }
        $bytes = [System.IO.File]::ReadAllBytes($exe)
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
        $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
        if ($machine -ne 0xAA64) { throw ("Published EquinoxLocal.exe is not ARM64 (machine=0x{0:X4})" -f $machine) }
        $loader = Get-ChildItem $publish -Filter WebView2Loader.dll -Recurse | Select-Object -First 1
        if ($null -eq $loader) { throw 'Published ARM64 shell is missing WebView2Loader.dll' }

    - name: Windows ARM64 managed package assembly smoke
      id: package
      shell: pwsh
      env:
        EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/windows-shell/win-arm64
        EQUINOX_WINDOWS_PACKAGE_TARGET: win32-arm64
      run: |
        npm run local:release:package:windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $artifacts = @(Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-arm64.zip')
        if ($artifacts.Count -ne 1) { throw 'Expected exactly one Windows ARM64 managed ZIP artifact' }
        $artifact = $artifacts[0]
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($artifact.FullName)
        try {
          $names = @($zip.Entries | ForEach-Object FullName)
          foreach ($required in @('release/release.json','release/runtime/node/bin/node.exe','release/runtime/tunnel/tunnel-client.exe','release/runtime/tunnel/cloudflared.exe','release/runtime/browser/equinox-browser-native-host.exe','release/runtime/shell/EquinoxLocal.exe','release/runtime/winapp/winapp.exe','release/runtime/winapp/libHarfBuzzSharp.dll','release/runtime/winapp/libSkiaSharp.dll','release/runtime/winapp/LICENSE','release/node_modules/node-pty/prebuilds/win32-arm64/conpty.node')) {
            if ($names -notcontains $required) { throw "Windows ARM64 managed ZIP is missing $required" }
          }
          $entry = $zip.GetEntry('release/release.json')
          $reader = [System.IO.StreamReader]::new($entry.Open())
          try { $metadata = ($reader.ReadToEnd() | ConvertFrom-Json) } finally { $reader.Dispose() }
          if ($metadata.target -ne 'win32-arm64') { throw "Windows ARM64 release metadata target mismatch: $($metadata.target)" }
          if ($names | Where-Object { $_ -like 'release/runtime/peekaboo/*' }) { throw 'Windows ARM64 managed ZIP unexpectedly contains Peekaboo' }
        } finally { $zip.Dispose() }
        $sha256 = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
        if ([string]$metadata.version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Windows ARM64 release metadata version is invalid' }
        if ([string]$metadata.sourceSha -cnotmatch '^[a-f0-9]{40}$') { throw 'Windows ARM64 release metadata sourceSha is invalid' }
        "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "bytes=$($artifact.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "version=$($metadata.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "target=$($metadata.target)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "source_sha=$($metadata.sourceSha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
