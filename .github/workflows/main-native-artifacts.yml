name: Main Native Artifacts

on:
  workflow_dispatch:
    inputs:
      current:
        description: Exact previously admitted canonical main SHA
        required: true
        type: string
      target:
        description: Exact canonical main SHA to validate and build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: main-native-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  plan:
    name: Exact-SHA native impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native-impact: ${{ steps.plan.outputs.native-impact }}
      github-count: ${{ steps.plan.outputs.github-count }}
      github-matrix: ${{ steps.plan.outputs.github-matrix }}
      factory-targets: ${{ steps.plan.outputs.factory-targets }}
    steps:
      - name: Checkout workflow implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refresh canonical main ref
        shell: bash
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0

      - name: Plan exact-SHA native artifacts
        id: plan
        shell: bash
        env:
          CURRENT_SHA: ${{ inputs.current }}
          TARGET_SHA: ${{ inputs.target }}
        run: |
          plan_file="$RUNNER_TEMP/main-native-plan.json"
          node scripts/release/plan-main-native-artifacts.mjs --current-sha "$CURRENT_SHA" --target-sha "$TARGET_SHA" > "$plan_file"
          cat "$plan_file"
          PLAN_FILE="$plan_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync(process.env.PLAN_FILE, 'utf8'));
          const lines = [
            `native-impact=${plan.nativeImpact}`,
            `github-count=${plan.githubTargets.length}`,
            `github-matrix=${JSON.stringify({ include: plan.githubTargets })}`,
            `factory-targets=${JSON.stringify(plan.factoryTargets)}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join('\n')}\n`);
          NODE

      - name: Upload exact-SHA build plan
        uses: actions/upload-artifact@v7
        with:
          name: main-native-plan-${{ inputs.target }}
          path: ${{ runner.temp }}/main-native-plan.json
          if-no-files-found: error
          retention-days: 14

  github-native:
    needs: plan
    if: ${{ needs.plan.outputs.github-count != '0' }}
    name: Main ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.github-matrix) }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Verify exact target SHA
        shell: bash
        if: ${{ matrix.platform == 'darwin' }}
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target }}"

      - name: Verify exact target SHA on Windows
        shell: pwsh
        if: ${{ matrix.platform == 'win32' }}
        run: |
          if ((git rev-parse HEAD) -ne '${{ inputs.target }}') { throw 'Main native builder checked out the wrong target SHA' }

      - name: Set up native Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Verify native host target
        run: |
          node -e "const expected='${{ matrix.target }}'; const actual=process.platform+'-'+process.arch; if(actual!==expected) throw new Error('Native host drift: '+actual+' != '+expected)"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Set up .NET SDK
        if: ${{ matrix.platform == 'win32' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows native shell payload
        if: ${{ matrix.platform == 'win32' }}
        shell: pwsh
        run: |
          dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime '${{ matrix.shellRid }}' --self-contained true -p:Platform='${{ matrix.dotnetPlatform }}' --output 'artifacts/windows-shell/${{ matrix.shellRid }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build exact-SHA Main native artifact
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: artifacts/windows-shell/${{ matrix.shellRid }}
        run: node scripts/release/build-main-native-artifact.mjs --source-sha "${{ inputs.target }}" --target "${{ matrix.target }}"

      - name: Upload exact-SHA Main native candidate
        uses: actions/upload-artifact@v7
        with:
          name: main-native-${{ inputs.target }}-${{ matrix.target }}
          path: artifacts/main-native/*
          if-no-files-found: error
          retention-days: 14

  result:
    needs: [plan, github-native]
    if: ${{ always() }}
    name: Main native candidate result
    runs-on: ubuntu-latest
    steps:
      - name: Enforce GitHub-native build result
        env:
          NATIVE_IMPACT: ${{ needs.plan.outputs.native-impact }}
          GITHUB_COUNT: ${{ needs.plan.outputs.github-count }}
          GITHUB_RESULT: ${{ needs.github-native.result }}
          FACTORY_TARGETS: ${{ needs.plan.outputs.factory-targets }}
        shell: bash
        run: |
          if [ "$GITHUB_COUNT" != "0" ] && [ "$GITHUB_RESULT" != "success" ]; then
            echo "Required GitHub-native Main artifact build failed: $GITHUB_RESULT" >&2
            exit 1
          fi
          {
            echo "## Main native candidate validation"
            echo "- Native impact: $NATIVE_IMPACT"
            echo "- GitHub-native target count: $GITHUB_COUNT"
            echo "- Factory-native targets still requiring separate admission: \`$FACTORY_TARGETS\`"
            echo ""
            echo "This workflow creates exact-SHA candidate artifacts only. It does not by itself admit a Main SHA or replace Stable releases."
          } >> "$GITHUB_STEP_SUMMARY"
