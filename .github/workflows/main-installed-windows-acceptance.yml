name: Main Windows Installed Upgrade Acceptance

# Expensive real per-user Windows installer/shell/Control Center/worker smoke.
# Deliberately manual, NEVER part of routine PR/push CI.
on:
  workflow_dispatch:
    inputs:
      legacy_reinstall_acceptance:
        description: Host-only pinned 5.2.1 Main to new unsigned Stable reinstall/rollback acceptance
        required: false
        default: false
        type: boolean
      diagnose_unreleased_harness:
        description: Isolated PR230-branch QA only; target B remains separately admitted Main tag, no product publication
        required: false
        default: false
        type: boolean
      stable_bridge_acceptance:
        description: Run hosted Stable-to-Main unsigned candidate bridge acceptance, not Main-to-Main
        required: false
        default: false
        type: boolean
      signed_610_reinstall_acceptance:
        description: Hosted-only exact old 6.1.0 package to PR native candidate via classic PowerShell reinstall (keeps user settings, reclaims old versions)
        required: false
        default: false
        type: boolean
      signed_612_reinstall_acceptance:
        description: Disposable signed public v6.1.2 Windows A to unsigned native B Stable repair and rollback; no production publish
        required: false
        default: false
        type: boolean
      previous_main_sha:
        description: Separately admitted immutable Main A SHA
        required: true
        default: 8dbe965d28e76026123ce8de34d8f1aa27c10465
        type: string
      scenario:
        description: Actual installed Windows Main update path
        required: true
        default: positive
        type: choice
        options:
          - positive
          - target-crash
      previous_main_run:
        description: Successful exact-A Main CI run with native build artifacts (retained for 14 days)
        required: true
        default: '37739535304'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: main-windows-installed-acceptance
  cancel-in-progress: false

jobs:
  installed-update:
    if: ${{ !inputs.stable_bridge_acceptance && !inputs.signed_610_reinstall_acceptance && !inputs.signed_612_reinstall_acceptance }}
    name: Windows ${{ matrix.target }} real installed A-to-B Main upgrade
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
            arch: x64
          - target: win32-arm64
            runner: windows-11-vs2026-arm
            arch: arm64
    env:
      OLD_SHA: ${{ inputs.previous_main_sha }}
      EXPECTED_REPOSITORY: sametbasbug/equinox-local
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout harness with immutable native product evidence
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install native Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          architecture: ${{ matrix.arch }}

      - name: Verify disposable machine, source A ancestry and admitted B
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne $env:EXPECTED_REPOSITORY -or (node -p 'process.platform + "-" + process.arch') -cne $env:TARGET) { throw 'Host platform or expected repository drift.' }
          if ($env:OLD_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid A SHA.' }
          if ('${{ inputs.legacy_reinstall_acceptance }}' -eq 'true' -and
              ('${{ inputs.diagnose_unreleased_harness }}' -ne 'true' -or
               $env:GITHUB_REF -cne 'refs/heads/equinox/windows-native-integrated-ab-supervisor' -or
               $env:OLD_SHA -cne '8dbe965d28e76026123ce8de34d8f1aa27c10465')) {
            throw 'Historical native repair requires pinned A on disposable PR230 runner.'
          }
          if (Test-Path 'Registry::HKEY_CURRENT_USER\Software\Google\Chrome\NativeMessagingHosts\dev.equinox.browser') { throw 'Runner has pre-existing Equinox Local Native Messaging ownership.' }
          $line = (& git ls-remote origin refs/tags/main-snapshot | Select-Object -First 1)
          $sha = ([string]$line -split '\s+')[0]
          if ($sha -cnotmatch '^[a-f0-9]{40}$' -or $sha -ceq $env:OLD_SHA) { throw 'Expected a newer admitted B snapshot.' }
          & git merge-base --is-ancestor $env:OLD_SHA $sha
          if ($LASTEXITCODE -ne 0) { throw 'A is not an ancestor of B.' }
          & git merge-base --is-ancestor $sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Harness branch is not descended from admitted B.' }
          if ('${{ inputs.diagnose_unreleased_harness }}' -eq 'true') {
            if ($env:GITHUB_REF -cne 'refs/heads/equinox/windows-native-integrated-ab-supervisor') { throw 'PR-only QA diagnostic forbidden outside exact development branch.' }
            'QA DIAGNOSTIC ONLY: unadmitted branch is a disposable test harness, B is admitted public snapshot.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            # Non-product CI/docs/test changes after B never change its admitted
            # runtime. Reuse the exact canonical Main admission classifier,
            # rejecting any unadmitted product code and any classifier failure.
            $headSha = (& git rev-parse HEAD).Trim()
            $planJson = & node scripts/release/plan-main-native-artifacts.mjs --current-sha $sha --target-sha $headSha
            if ($LASTEXITCODE -ne 0) { throw 'Canonical Main update-impact preflight failed closed.' }
            $plan = ($planJson | Out-String) | ConvertFrom-Json
            if ($plan.schemaVersion -ne 1 -or $plan.currentSha -cne $sha -or
                $plan.targetSha -cne $headSha -or $plan.mainUpdateImpact -ne $false) {
              throw 'Unadmitted product code after Main snapshot; refusing Windows installed acceptance.'
            }
            "Installed Windows acceptance uses exact admitted B; $($plan.changedPathCount) later non-product CI/docs/test paths were classified safe." >> $env:GITHUB_STEP_SUMMARY
          }
          "target_sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Download archived, already-admitted native Windows A artifact
        uses: actions/download-artifact@v8
        with:
          name: main-native-${{ inputs.previous_main_sha }}-${{ matrix.target }}
          run-id: ${{ inputs.previous_main_run }}
          github-token: ${{ github.token }}
          repository: sametbasbug/equinox-local
          path: ${{ runner.temp }}/old-main

      - uses: actions/setup-dotnet@v6
        if: ${{ inputs.legacy_reinstall_acceptance }}
        with:
          dotnet-version: 10.0.x
      - name: Publish exact new native WPF for isolated historic Stable reinstall
        if: ${{ inputs.legacy_reinstall_acceptance }}
        shell: pwsh
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/stable-repair-shell/win-${{ matrix.arch }}
          EQUINOX_WINDOWS_SHELL_BIN_DIR: ${{ runner.temp }}/stable-repair-bin/win-${{ matrix.arch }}/
          EQUINOX_WINDOWS_SHELL_OBJ_DIR: ${{ runner.temp }}/stable-repair-obj/win-${{ matrix.arch }}/
        run: |
          dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime 'win-${{ matrix.arch }}' --self-contained true -p:Platform='${{ matrix.arch == 'arm64' && 'ARM64' || 'x64' }}' -p:BaseOutputPath="$env:EQUINOX_WINDOWS_SHELL_BIN_DIR" -p:BaseIntermediateOutputPath="$env:EQUINOX_WINDOWS_SHELL_OBJ_DIR" --output "$env:EQUINOX_WINDOWS_SHELL_PUBLISH_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package exact new Stable rehearsal ZIP with native WPF
        if: ${{ inputs.legacy_reinstall_acceptance }}
        shell: pwsh
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/stable-repair-shell/win-${{ matrix.arch }}
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run local:release:package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-${{ matrix.target }}.zip' | Select-Object -First 1
          if ($null -eq $candidate) { throw 'Exact native Stable candidate ZIP missing.' }
          "EQUINOX_WINDOWS_LEGACY_STABLE_ARTIFACT=$($candidate.FullName)" >> $env:GITHUB_ENV
          'UNSIGNED source-provenance rehearsal only, never a production signed release.' >> $env:GITHUB_STEP_SUMMARY

      - name: Verify native package manifest and run REAL Windows public installer plus Control Center A-to-B
        shell: pwsh
        env:
          TARGET_SHA: ${{ steps.identity.outputs.target_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'old-main'
          $manifestPath = Join-Path $root "equinox-local-main-$env:OLD_SHA-$env:TARGET.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'Exact source-A Main native manifest missing.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or $manifest.channel -cne 'main' -or $manifest.sourceSha -cne $env:OLD_SHA -or $manifest.target -cne $env:TARGET) { throw 'Immutable source-A manifest identity mismatch.' }
          $artifact = Join-Path $root ([string]$manifest.artifact.name)
          if ([IO.Path]::GetFullPath($artifact) -cne [IO.Path]::GetFullPath((Join-Path $root "equinox-local-main-$env:OLD_SHA-$env:TARGET.zip"))) { throw 'Unexpected A ZIP path.' }
          $file = Get-Item -LiteralPath $artifact -ErrorAction Stop
          if ($file.Length -ne [int64]$manifest.artifact.bytes -or (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$manifest.artifact.sha256) { throw 'Source-A archive hash/bytes mismatch.' }
          $env:EQUINOX_WINDOWS_INSTALL_ARTIFACT = $artifact
          $env:EQUINOX_WINDOWS_INSTALL_SHA256 = [string]$manifest.artifact.sha256
          $env:EQUINOX_WINDOWS_INSTALL_BYTES = [string]$manifest.artifact.bytes
          $env:EQUINOX_WINDOWS_INSTALL_TARGET = [string]$manifest.target
          $env:EQUINOX_WINDOWS_INSTALL_SOURCE_SHA = [string]$manifest.sourceSha
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead($artifact)
          try {
            $entry = $archive.GetEntry('release/release.json')
            if ($null -eq $entry -or $entry.Length -gt 16384) { throw 'Admitted A archive release metadata is missing or oversized.' }
            $reader = New-Object IO.StreamReader($entry.Open(), (New-Object Text.UTF8Encoding($false, $true)))
            try { $release = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          if ($release.sourceSha -cne $env:OLD_SHA -or $release.target -cne $env:TARGET -or [string]$release.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Admitted A release JSON identity mismatch.' }
          $env:EQUINOX_WINDOWS_INSTALL_VERSION = [string]$release.version
          $env:EQUINOX_WINDOWS_MAIN_ACCEPT_TARGET_SHA = $env:TARGET_SHA
          $env:EQUINOX_WINDOWS_MAIN_ACCEPT_SCENARIO = '${{ inputs.scenario }}'
          $env:EQUINOX_WINDOWS_LEGACY_REINSTALL_ACCEPTANCE = '${{ inputs.legacy_reinstall_acceptance }}'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-real-package-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Optional genuine native hosted-OS bridge smoke. No production signing.
  stable-bridge-windows:
    if: ${{ inputs.stable_bridge_acceptance && !inputs.signed_610_reinstall_acceptance && !inputs.signed_612_reinstall_acceptance }}
    name: Windows ${{ matrix.arch }} owned WPF Stable-to-Main bridge and recovery
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, rid: win-x64, platform: x64 }
          - { arch: arm64, runner: windows-11-vs2026-arm, rid: win-arm64, platform: ARM64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify disposable native host and unowned installer state
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'sametbasbug/equinox-local' -or
              $env:GITHUB_ACTIONS -cne 'true' -or
              (node -p 'process.platform + "-" + process.arch') -cne 'win32-${{ matrix.arch }}') {
            throw 'Hosted bridge acceptance native runner identity mismatch'
          }
          $appRoot = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)) 'Equinox Local'
          if (Test-Path -LiteralPath $appRoot) { throw 'Refusing to modify a preexisting Equinox Local Windows installation' }
          if (Test-Path 'Registry::HKEY_CURRENT_USER\Software\Google\Chrome\NativeMessagingHosts\dev.equinox.browser') {
            throw 'Refusing to replace a pre-existing Browser Native Messaging registry key'
          }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Publish exact native WPF for this hosted architecture
        shell: pwsh
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/stable-bridge-shell/${{ matrix.rid }}
          EQUINOX_WINDOWS_SHELL_BIN_DIR: ${{ runner.temp }}/stable-bridge-bin/${{ matrix.rid }}/
          EQUINOX_WINDOWS_SHELL_OBJ_DIR: ${{ runner.temp }}/stable-bridge-obj/${{ matrix.rid }}/
        run: |
          dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime '${{ matrix.rid }}' --self-contained true -p:Platform='${{ matrix.platform }}' -p:BaseOutputPath="$env:EQUINOX_WINDOWS_SHELL_BIN_DIR" -p:BaseIntermediateOutputPath="$env:EQUINOX_WINDOWS_SHELL_OBJ_DIR" --output "$env:EQUINOX_WINDOWS_SHELL_PUBLISH_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact checkout managed native release ZIP
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/stable-bridge-shell/${{ matrix.rid }}
        run: npm run local:release:package:windows
      - name: Install REAL native WPF with default Main, then exercise Stable bridge and failure rollback
        shell: pwsh
        env:
          EQUINOX_WINDOWS_STABLE_BRIDGE_ACCEPTANCE: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-${{ matrix.arch }}.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Managed native bridge acceptance ZIP missing' }
          $env:EQUINOX_WINDOWS_INSTALL_ARTIFACT = $artifact.FullName
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-real-package-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Disposable hosted acceptance: original archived old6.1.0 OR actual
  # immutable PUBLIC SIGNED v6.1.2 ZIP as A. This branch builds UNSIGNED B,
  # then exercises classic PowerShell Stable repair, forced failed B rollback
  # (Guardian original NTFS File ID preserved) and healthy B promotion.
  # An unsigned B fixture is NOT full production-signed acceptance or authority
  # to bypass independent native Main WPF A/B supervisor. Never mutate user PC.
  signed-old-to-candidate-reinstall:
    if: ${{ inputs.signed_610_reinstall_acceptance || inputs.signed_612_reinstall_acceptance }}
    name: Windows ${{ matrix.arch }} pinned old A to native candidate Stable repair
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, rid: win-x64, platform: x64, signed612sha: e8c86e676ff2319c6f1171b971156e17b6dd86bc2fde4bca6e9aded223cb401b, signed612bytes: 244877669 }
          - { arch: arm64, runner: windows-11-vs2026-arm, rid: win-arm64, platform: ARM64, signed612sha: 9b8eb1f7ce07c40b9815151a3758258e679d393baaf795031eb58886763edc45, signed612bytes: 227967258 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse native installer smoke PowerShell before downloads or native builds
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          $file = Join-Path $env:GITHUB_WORKSPACE 'tests/release/windows-installer-real-package-smoke.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if ($null -ne $errors -and $errors.Count -gt 0) {
            foreach ($error in $errors) { Write-Error ($error.Extent.StartLineNumber.ToString() + ': ' + $error.Message) }
            throw 'Installer acceptance PowerShell has syntax errors; do not build/download signed payloads.'
          }
          Write-Output 'Legacy and signed 6.1.2 installer PowerShell grammar validated before native build.'
      - name: Enforce exact, isolated public A and candidate B
        shell: pwsh
        env:
          OLD_SHA: ${{ inputs.signed_612_reinstall_acceptance && '66786207350cc809b44fc5c376eba8912b35fa47' || 'e85790a99e8e05ccf9997279d174b452793d6097' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.signed_610_reinstall_acceptance }}' -eq 'true' -and
              '${{ inputs.signed_612_reinstall_acceptance }}' -eq 'true') {
            throw 'Choose exactly one historical or signed 6.1.2 native repair test.'
          }
          if ($env:GITHUB_REPOSITORY -cne 'sametbasbug/equinox-local' -or $env:GITHUB_ACTIONS -cne 'true' -or
              (node -p 'process.platform + "-" + process.arch') -cne 'win32-${{ matrix.arch }}' -or
              $env:GITHUB_REF -notlike 'refs/heads/equinox/*') {
            throw 'Candidate reinstall acceptance requires a disposable native Windows runner and explicit development branch'
          }
          & git merge-base --is-ancestor $env:OLD_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate B does not descend from the exact signed 6.1.0 A source' }
          $root = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)) 'Equinox Local'
          if (Test-Path -LiteralPath $root) { throw 'Unexpected real user Equinox Local data on disposable acceptance runner' }
          if (Test-Path 'Registry::HKEY_CURRENT_USER\Software\Google\Chrome\NativeMessagingHosts\dev.equinox.browser') {
            throw 'Native Messaging registry key is already owned by a different installation'
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Retrieve immutable exact-6.1.0 A native ZIP from successful release validation
        if: ${{ inputs.signed_610_reinstall_acceptance }}
        uses: actions/download-artifact@v8
        with:
          name: equinox-local-6.1.0-win32-${{ matrix.arch }}-unsigned
          run-id: '38943722251'
          github-token: ${{ github.token }}
          repository: sametbasbug/equinox-local
          path: ${{ runner.temp }}/signed-610-base
      - name: Download actual signed public v6.1.2 A by pinned GitHub Release digest
        if: ${{ inputs.signed_612_reinstall_acceptance }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ matrix.signed612sha }}
          EXPECTED_BYTES: ${{ matrix.signed612bytes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'win32-${{ matrix.arch }}'
          $name = "equinox-local-6.1.2-$target.zip"
          $root = Join-Path $env:RUNNER_TEMP 'signed-612-base'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          gh release download v6.1.2 -R sametbasbug/equinox-local --pattern $name --dir $root --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public signed v6.1.2 A release download failed.' }
          $artifact = Join-Path $root $name
          $files = @(Get-ChildItem -LiteralPath $root -File)
          if ($files.Count -ne 1 -or $files[0].Name -cne $name -or
              $files[0].Length -ne [int64]$env:EXPECTED_BYTES -or
              (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_SHA256) {
            throw 'Signed old A release asset name, bytes or pinned SHA256 differs.'
          }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [IO.Compression.ZipFile]::OpenRead($artifact)
          try {
            $entry = $zip.GetEntry('release/release.json')
            if ($null -eq $entry -or $entry.Length -lt 2 -or $entry.Length -gt 16384) { throw 'Signed A lacks bounded release identity.' }
            $reader = [IO.StreamReader]::new($entry.Open(), [Text.UTF8Encoding]::new($false,$true))
            try { $release = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          if ($release.schemaVersion -ne 1 -or $release.version -cne '6.1.2' -or
              $release.sourceSha -cne '66786207350cc809b44fc5c376eba8912b35fa47' -or $release.target -cne $target) {
            throw 'Public signed A release source SHA/version/native target differs from pin.'
          }
          'Production-published old A archive has pinned independent SHA256 and bytes; B is an unsigned candidate rehearsal only.' >> $env:GITHUB_STEP_SUMMARY
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Publish candidate B genuine WPF native executable
        shell: pwsh
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/candidate-shell/${{ matrix.rid }}
          EQUINOX_WINDOWS_SHELL_BIN_DIR: ${{ runner.temp }}/candidate-bin/${{ matrix.rid }}/
          EQUINOX_WINDOWS_SHELL_OBJ_DIR: ${{ runner.temp }}/candidate-obj/${{ matrix.rid }}/
        run: |
          dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime '${{ matrix.rid }}' --self-contained true -p:Platform='${{ matrix.platform }}' -p:BaseOutputPath="$env:EQUINOX_WINDOWS_SHELL_BIN_DIR" -p:BaseIntermediateOutputPath="$env:EQUINOX_WINDOWS_SHELL_OBJ_DIR" --output "$env:EQUINOX_WINDOWS_SHELL_PUBLISH_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package exact checked-out candidate B native artifact (unsigned, never production)
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/candidate-shell/${{ matrix.rid }}
        run: npm run local:release:package:windows
      - name: Real PowerShell 6.1.0 to candidate reinstall, native rollback, user data and disk GC
        shell: pwsh
        env:
          EQUINOX_WINDOWS_LEGACY_REINSTALL_ACCEPTANCE: 'true'
          EQUINOX_WINDOWS_SIGNED_612_REINSTALL_ACCEPTANCE: ${{ inputs.signed_612_reinstall_acceptance }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseDir = if ('${{ inputs.signed_612_reinstall_acceptance }}' -eq 'true') {
            '${{ runner.temp }}/signed-612-base'
          } else {
            '${{ runner.temp }}/signed-610-base'
          }
          $old = @(Get-ChildItem -LiteralPath $baseDir -Recurse -File -Filter '*.zip')
          $new = @(Get-ChildItem -LiteralPath 'backups/local-packages' -File -Filter 'equinox-local-*-win32-${{ matrix.arch }}.zip')
          if ($old.Count -ne 1 -or $new.Count -ne 1) { throw 'Expected exactly one immutable A archive and one matching native candidate B ZIP' }
          $env:EQUINOX_WINDOWS_INSTALL_ARTIFACT = $old[0].FullName
          $env:EQUINOX_WINDOWS_LEGACY_STABLE_ARTIFACT = $new[0].FullName
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-real-package-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
