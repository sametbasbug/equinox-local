name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS / Node 26
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Test
        run: npm test

  windows-runtime:
    name: Windows x64 runtime / Node 26
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Windows browser PDF text extraction smoke
        run: node --test tests/browser/browser-pdf-text.test.js

      - name: Windows transfer and Telegram path parity smoke
        run: node --test --test-name-pattern "Web transfer defaults follow the shared Windows per-user path contract|Telegram defaults follow the shared Windows per-user path contract" tests/unit/equinox-local-file-transfer.test.js tests/unit/telegram-integration.test.js

      - name: Windows managed Doctor parity smoke
        run: node --test --test-name-pattern "managed Windows Doctor" tests/release/equinox-local-doctor.test.js

      - name: Windows private-state ACL acceptance
        run: node --test tests/release/equinox-local-windows-private-state.test.js

      - name: Windows managed release contract and activation rollback tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --test tests/release/equinox-local-release-runtime-contract.test.js
          node --test --test-name-pattern "Windows x64 first-install release validation accepts native runtime names without Peekaboo|Windows x64 fresh first install promotes current-version and stable shell without admin" tests/release/equinox-local-first-install.test.js
          node --test --test-name-pattern "Windows x64 managed user bootstrap uses state config and Windows Native Messaging without Darwin lifecycle" tests/release/equinox-local-bootstrap.test.js
          node --test tests/release/equinox-local-current-release.test.js
          node --test tests/release/equinox-local-windows-stable-shell.test.js
          node --test --test-name-pattern "Windows activation rollback restores current-version.json and the previous exact release|Windows managed activation rotates pointer stable shell and Native Messaging together|Windows managed activation forced health failure restores pointer stable shell and Native Messaging" tests/release/equinox-local-update-activation.test.js
          node --test tests/release/equinox-local-windows-lifecycle.test.js

      - name: Windows PowerShell 5.1 bootstrap acceptance
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-bootstrap-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows headless runtime smoke
        run: npm run smoke:windows-headless

      - name: Windows Native Messaging launcher smoke
        run: node tests/release/windows-native-messaging-smoke.mjs

  windows-shell:
    name: Windows x64 native shell
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Windows native shell
        run: dotnet build native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release -p:Platform=x64

      - name: Publish Windows x64 native shell
        run: dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 --output artifacts/windows-shell/win-x64

      - name: Windows x64 native shell publish smoke
        shell: pwsh
        run: |
          $publish = Join-Path $PWD 'artifacts/windows-shell/win-x64'
          $exe = Join-Path $publish 'EquinoxLocal.exe'
          foreach ($required in @($exe, (Join-Path $publish 'coreclr.dll'), (Join-Path $publish 'hostfxr.dll'), (Join-Path $publish 'Microsoft.Web.WebView2.Core.dll'))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing published Windows shell component: $required" }
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 64) { throw 'Published EquinoxLocal.exe is unexpectedly small' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) { throw 'Published EquinoxLocal.exe has an invalid PE header offset' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Published EquinoxLocal.exe is not x64 (machine=0x{0:X4})" -f $machine) }
          $loader = Get-ChildItem $publish -Filter WebView2Loader.dll -Recurse | Select-Object -First 1
          if ($null -eq $loader) { throw 'Published shell is missing WebView2Loader.dll' }

      - name: Windows native shell branding smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/windows/EquinoxLocal.WindowsShell/bin -Filter EquinoxLocal.exe -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "EquinoxLocal.exe was not built" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if ($null -eq $icon) { throw "EquinoxLocal.exe has no embedded application icon" }
          try {
            if ($icon.Width -lt 16 -or $icon.Height -lt 16) { throw "Embedded Equinox icon is unexpectedly small" }
            $bitmap = $icon.ToBitmap()
            try {
              $pixel = $bitmap.GetPixel([int]($bitmap.Width / 2), [int]($bitmap.Height / 2))
              if ($pixel.A -eq 0) { throw "Embedded Equinox icon center is transparent" }
            } finally { $bitmap.Dispose() }
          } finally { $icon.Dispose() }

      - name: Windows native shell runtime supervision smoke
        shell: pwsh
        run: |
          $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
          dotnet run --project tests/windows/EquinoxLocal.WindowsShell.RuntimeHarness/EquinoxLocal.WindowsShell.RuntimeHarness.csproj --configuration Release

      - name: Windows native shell update handoff smoke
        shell: pwsh
        run: |
          $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
          dotnet run --project tests/windows/EquinoxLocal.WindowsShell.UpdateHandoffHarness/EquinoxLocal.WindowsShell.UpdateHandoffHarness.csproj --configuration Release

      - name: Windows native shell uninstall handoff smoke
        shell: pwsh
        run: |
          $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
          dotnet run --project tests/windows/EquinoxLocal.WindowsShell.UninstallHandoffHarness/EquinoxLocal.WindowsShell.UninstallHandoffHarness.csproj --configuration Release

      - name: Windows native shell startup registration smoke
        run: dotnet run --project tests/windows/EquinoxLocal.WindowsShell.StartupHarness/EquinoxLocal.WindowsShell.StartupHarness.csproj --configuration Release

      - name: Windows native shell folder picker smoke
        run: dotnet run --project tests/windows/EquinoxLocal.WindowsShell.FolderPickerHarness/EquinoxLocal.WindowsShell.FolderPickerHarness.csproj --configuration Release

      - name: Windows native shell presentation smoke
        run: dotnet run --project tests/windows/EquinoxLocal.WindowsShell.PresentationHarness/EquinoxLocal.WindowsShell.PresentationHarness.csproj --configuration Release

  windows-package:
    name: Windows x64 managed package
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish package shell payload
        run: dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 --output artifacts/windows-shell/win-x64

      - name: Windows release ZIP security acceptance
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-release-zip-smoke.ps1

      - name: Windows managed package assembly smoke
        shell: pwsh
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: artifacts/windows-shell/win-x64
        run: |
          npm run local:release:package:windows
          $artifact = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-x64.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Windows managed ZIP artifact was not created' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($artifact.FullName)
          try {
            $names = @($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('release/release.json','release/runtime/node/bin/node.exe','release/runtime/tunnel/tunnel-client.exe','release/runtime/tunnel/cloudflared.exe','release/runtime/browser/equinox-browser-native-host.exe','release/runtime/shell/EquinoxLocal.exe','release/runtime/winapp/winapp.exe','release/runtime/winapp/libHarfBuzzSharp.dll','release/runtime/winapp/libSkiaSharp.dll','release/runtime/winapp/LICENSE')) {
              if ($names -notcontains $required) { throw "Windows managed ZIP is missing $required" }
            }
            if ($names | Where-Object { $_ -like 'release/runtime/peekaboo/*' }) { throw 'Windows managed ZIP unexpectedly contains Peekaboo' }
          } finally { $zip.Dispose() }

      - name: Windows x64 packaged winapp UIA smoke
        shell: pwsh
        run: |
          $fixtureOut = Join-Path $env:RUNNER_TEMP 'equinox-winapp-fixture-x64'
          dotnet publish tests/windows/EquinoxLocal.WinappSmokeFixture/EquinoxLocal.WinappSmokeFixture.csproj --configuration Release --runtime win-x64 --self-contained false -p:Platform=x64 --output $fixtureOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifact = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-x64.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Windows managed ZIP artifact was not found for winapp acceptance' }
          $extract = Join-Path $env:RUNNER_TEMP 'equinox-winapp-x64'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & tar.exe -xf $artifact.FullName -C $extract 'release/runtime/winapp/winapp.exe' 'release/runtime/winapp/libHarfBuzzSharp.dll' 'release/runtime/winapp/libSkiaSharp.dll' 'release/equinox-local-windows-clipboard.ps1' 'release/equinox-local-windows-desktop.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-winapp-smoke.ps1 -WinappPath (Join-Path $extract 'release/runtime/winapp/winapp.exe') -FixturePath (Join-Path $fixtureOut 'EquinoxLocal.WinappSmokeFixture.exe') -ClipboardHelperPath (Join-Path $extract 'release/equinox-local-windows-clipboard.ps1') -DesktopHelperPath (Join-Path $extract 'release/equinox-local-windows-desktop.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64-shared-core:
    name: Windows ARM64 shared core / Node 26
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up native ARM64 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: arm64
          cache: npm

      - name: Verify native ARM64 Node host
        shell: pwsh
        run: |
          if ((node -p "process.platform") -ne 'win32') { throw 'ARM64 shared-core lane is not running on Windows' }
          if ((node -p "process.arch") -ne 'arm64') { throw 'ARM64 shared-core lane is not running native ARM64 Node' }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Windows ARM64 shared core parity suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Shared logic remains a real ARM64 acceptance requirement, but it runs in parallel with native lifecycle/package work.
          # Keep POSIX-only mode/path assertions out of the Windows lane; exact Windows private-state persistence has dedicated ACL acceptance.
          node --test tests/unit/capability-registry.test.js tests/unit/task-capsule-tools.test.js tests/unit/auto-continue-controller.test.js tests/unit/fresh-chat-resume-controller.test.js tests/unit/telegram-chat-bridge-controller.test.js tests/unit/authenticated-http-tools.test.js tests/unit/authenticated-http-response-references.test.js
          node --test tests/unit/task-capsule-store.test.js tests/unit/turn-budget-controller.test.js tests/unit/equinox-local-file-transfer.test.js tests/unit/authenticated-http-integration.test.js
          node --test --test-name-pattern "Telegram defaults follow the shared Windows per-user path contract|Telegram connection input accepts only a token and positive user ID|Telegram message validation is bounded and rejects empty content|command menu sync is a no-op when Telegram is not configured|failed Telegram validation does not persist credentials or expose the token" tests/unit/telegram-integration.test.js
          node --test tests/release/equinox-local-windows-private-state.test.js

  windows-arm64-bootstrap:
    name: Windows ARM64 bootstrap / Node 26
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up native ARM64 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: arm64

      - name: Verify native ARM64 Node host
        shell: pwsh
        run: |
          if ((node -p "process.arch") -ne 'arm64') { throw 'ARM64 bootstrap lane is not running native ARM64 Node' }

      - name: Windows ARM64 PowerShell bootstrap contract acceptance
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-bootstrap-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Runtime, packaged Desktop/UIA and real installation acceptance are isolated
  # native ARM64 lanes and start together, without a serial artifact dependency.
  windows-arm64-runtime:
    name: Windows ARM64 runtime / Node 26
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up native ARM64 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: arm64
          cache: npm

      - name: Verify native ARM64 Node host
        shell: pwsh
        run: |
          if ((node -p "process.platform") -ne 'win32') { throw 'ARM64 lane is not running on Windows' }
          if ((node -p "process.arch") -ne 'arm64') { throw 'ARM64 lane is not running native ARM64 Node' }
          if ((node --version) -ne 'v26.10.0') { throw 'ARM64 lane Node version drifted' }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Native CI input success and failure propagation smoke
        shell: pwsh
        run: '& ./tests/release/windows-ci-input-preparation-smoke.ps1'

      - name: Windows ARM64 managed lifecycle plumbing smoke
        run: node --test tests/unit/equinox-local-platform.test.js tests/release/equinox-local-windows-arm64-lifecycle.test.js

      - name: Windows ARM64 headless runtime parity smoke
        run: npm run smoke:windows-headless

      - name: Windows ARM64 uninstall/reinstall lifecycle acceptance
        run: node --test tests/release/equinox-local-windows-lifecycle.test.js

      - name: Native ARM64 node-pty / ConPTY smoke
        timeout-minutes: 1
        run: node tests/release/windows-node-pty-smoke.mjs

      - name: Native ARM64 Native Messaging launcher smoke
        run: node tests/release/windows-native-messaging-smoke.mjs

  # Each acceptance lane prepares its own exact-checkout package. One bounded
  # extra build removes the artifact dependency and keeps installer startup warm.
  windows-arm64-package:
    name: Windows ARM64 managed package
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare native ARM64 CI package
        id: package
        uses: ./.github/actions/prepare-arm64-package

      - name: Verify exact prepared ARM64 CI package bytes
        shell: pwsh
        env:
          EXPECTED_PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          EXPECTED_PACKAGE_BYTES: ${{ steps.package.outputs.bytes }}
        run: |
          $artifacts = @(Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-arm64.zip')
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one current-run ARM64 CI package' }
          if ($env:EXPECTED_PACKAGE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:EXPECTED_PACKAGE_BYTES -notmatch '^[1-9][0-9]*$') { throw 'ARM64 package producer metadata is missing or invalid' }
          $sha256 = (Get-FileHash -LiteralPath $artifacts[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -cne $env:EXPECTED_PACKAGE_SHA256 -or $artifacts[0].Length -ne [int64]$env:EXPECTED_PACKAGE_BYTES) { throw 'ARM64 CI package digest or length differs from the producer' }

      - name: Windows ARM64 native shell uninstall handoff smoke
        shell: pwsh
        run: |
          $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
          $publish = Join-Path $PWD 'artifacts/windows-uninstall-handoff/win-arm64'
          dotnet publish tests/windows/EquinoxLocal.WindowsShell.UninstallHandoffHarness/EquinoxLocal.WindowsShell.UninstallHandoffHarness.csproj --configuration Release --runtime win-arm64 --self-contained true -p:Platform=ARM64 --output $publish
          & (Join-Path $publish 'EquinoxLocal.WindowsShell.UninstallHandoffHarness.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows ARM64 packaged winapp UIA smoke
        shell: pwsh
        run: |
          $fixtureOut = Join-Path $env:RUNNER_TEMP 'equinox-winapp-fixture-arm64'
          dotnet publish tests/windows/EquinoxLocal.WinappSmokeFixture/EquinoxLocal.WinappSmokeFixture.csproj --configuration Release --runtime win-arm64 --self-contained false -p:Platform=ARM64 --output $fixtureOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifact = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-arm64.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Windows ARM64 managed ZIP artifact was not found for winapp acceptance' }
          $extract = Join-Path $env:RUNNER_TEMP 'equinox-winapp-arm64'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & tar.exe -xf $artifact.FullName -C $extract 'release/runtime/winapp/winapp.exe' 'release/runtime/winapp/libHarfBuzzSharp.dll' 'release/runtime/winapp/libSkiaSharp.dll' 'release/equinox-local-windows-clipboard.ps1' 'release/equinox-local-windows-desktop.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-winapp-smoke.ps1 -WinappPath (Join-Path $extract 'release/runtime/winapp/winapp.exe') -FixturePath (Join-Path $fixtureOut 'EquinoxLocal.WinappSmokeFixture.exe') -ClipboardHelperPath (Join-Path $extract 'release/equinox-local-windows-clipboard.ps1') -DesktopHelperPath (Join-Path $extract 'release/equinox-local-windows-desktop.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64-installer:
    name: Windows ARM64 public installer acceptance
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare native ARM64 CI package
        id: package
        uses: ./.github/actions/prepare-arm64-package

      - name: Verify exact prepared ARM64 CI package bytes
        shell: pwsh
        env:
          EXPECTED_PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          EXPECTED_PACKAGE_BYTES: ${{ steps.package.outputs.bytes }}
        run: |
          $artifacts = @(Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-arm64.zip')
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one current-run ARM64 CI package' }
          if ($env:EXPECTED_PACKAGE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:EXPECTED_PACKAGE_BYTES -notmatch '^[1-9][0-9]*$') { throw 'ARM64 package producer metadata is missing or invalid' }
          $sha256 = (Get-FileHash -LiteralPath $artifacts[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -cne $env:EXPECTED_PACKAGE_SHA256 -or $artifacts[0].Length -ne [int64]$env:EXPECTED_PACKAGE_BYTES) { throw 'ARM64 CI package digest or length differs from the producer' }

      - name: Windows ARM64 real public-installer fresh-install acceptance
        shell: pwsh
        run: |
          $artifact = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-arm64.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Windows ARM64 managed ZIP artifact was not found for fresh-install acceptance' }
          $env:EQUINOX_WINDOWS_INSTALL_ARTIFACT = $artifact.FullName
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-real-package-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64-foundation:
    name: Windows ARM64 foundation / Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [windows-arm64-runtime, windows-arm64-package, windows-arm64-installer]

    steps:
      - name: Verify parallel native ARM64 acceptance
        env:
          ARM64_RUNTIME_RESULT: ${{ needs.windows-arm64-runtime.result }}
          ARM64_PACKAGE_RESULT: ${{ needs.windows-arm64-package.result }}
          ARM64_INSTALLER_RESULT: ${{ needs.windows-arm64-installer.result }}
        run: |
          test "$ARM64_RUNTIME_RESULT" = success
          test "$ARM64_PACKAGE_RESULT" = success
          test "$ARM64_INSTALLER_RESULT" = success

  windows-headless:
    name: Windows x64 headless / Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [windows-runtime, windows-shell, windows-package, windows-arm64-shared-core, windows-arm64-bootstrap, windows-arm64-foundation]

    steps:
      - name: Verify parallel Windows acceptance
        env:
          RUNTIME_RESULT: ${{ needs.windows-runtime.result }}
          SHELL_RESULT: ${{ needs.windows-shell.result }}
          PACKAGE_RESULT: ${{ needs.windows-package.result }}
          ARM64_SHARED_RESULT: ${{ needs.windows-arm64-shared-core.result }}
          ARM64_BOOTSTRAP_RESULT: ${{ needs.windows-arm64-bootstrap.result }}
          ARM64_RESULT: ${{ needs.windows-arm64-foundation.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$SHELL_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$ARM64_SHARED_RESULT" = success
          test "$ARM64_BOOTSTRAP_RESULT" = success
          test "$ARM64_RESULT" = success
