name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      main_native_current:
        description: Optional exact previous canonical main SHA for native recovery
        required: false
        type: string
      main_native_target:
        description: Optional exact canonical main SHA for native recovery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: macOS ARM64 / Node 26
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - parallel:
          - name: Static checks
            run: npm run check

          - name: Verify ARM64 host
            run: test "$(node -p process.platform)-$(node -p process.arch)" = "darwin-arm64"

          - name: Full test suite
            run: npm test

  macos-managed-source:
    name: macOS ARM64 managed-source fresh install
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify ARM64 host
        run: test "$(node -p process.platform)-$(node -p process.arch)" = "darwin-arm64"

      - name: Build source-provenance Stable package
        run: npm run local:release:package

      - name: Real managed-source fresh-install acceptance
        run: node tests/release/smoke-managed-install.mjs

  macos-x64:
    name: macOS x64 / Node 26
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64
          cache: npm

      - name: Install dependencies
        run: npm ci

      - parallel:
          - name: Verify x64 host
            run: test "$(node -p process.platform)-$(node -p process.arch)" = "darwin-x64"

          - name: Static checks
            run: npm run check

          - name: Fast architecture parity suite
            run: npm run test:fast

  windows-runtime:
    name: Windows x64 runtime / Node 26
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Windows browser PDF text extraction smoke
        run: node --test tests/browser/browser-pdf-text.test.js

      - name: Windows transfer and Telegram path parity smoke
        run: node --test --test-name-pattern "Web transfer defaults follow the shared Windows per-user path contract|Telegram defaults follow the shared Windows per-user path contract" tests/unit/equinox-local-file-transfer.test.js tests/unit/telegram-integration.test.js

      - name: Windows managed Doctor parity smoke
        run: node --test --test-name-pattern "managed Windows Doctor" tests/release/equinox-local-doctor.test.js

      - name: Windows private-state ACL acceptance
        run: node --test tests/release/equinox-local-windows-private-state.test.js

      - name: Windows managed release contract and activation rollback tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --test tests/release/equinox-local-release-runtime-contract.test.js
          node --test --test-name-pattern "Windows x64 first-install release validation accepts native runtime names without Peekaboo|Windows x64 fresh first install promotes current-version and stable shell without admin" tests/release/equinox-local-first-install.test.js
          node --test --test-name-pattern "Windows x64 managed user bootstrap uses state config and Windows Native Messaging without Darwin lifecycle" tests/release/equinox-local-bootstrap.test.js
          node --test tests/release/equinox-local-current-release.test.js
          node --test tests/release/equinox-local-windows-stable-shell.test.js
          node --test --test-name-pattern "Windows activation rollback restores current-version.json and the previous exact release|Windows managed activation rotates pointer stable shell and Native Messaging together|Windows managed activation forced health failure restores pointer stable shell and Native Messaging" tests/release/equinox-local-update-activation.test.js
          node --test tests/release/equinox-local-windows-lifecycle.test.js
          node --test tests/release/equinox-local-main-native-windows-acceptance.test.js

      - name: Windows PowerShell 5.1 bootstrap acceptance
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-bootstrap-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows headless runtime smoke
        run: npm run smoke:windows-headless

      - name: Windows Native Messaging launcher smoke
        run: node tests/release/windows-native-messaging-smoke.mjs

  windows-shell:
    name: Windows x64 native shell
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Windows native shell
        run: dotnet build native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release -p:Platform=x64

      - name: Publish Windows x64 native shell
        run: dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 --output artifacts/windows-shell/win-x64

      - name: Windows x64 native shell publish smoke
        shell: pwsh
        run: |
          $publish = Join-Path $PWD 'artifacts/windows-shell/win-x64'
          $exe = Join-Path $publish 'EquinoxLocal.exe'
          foreach ($required in @($exe, (Join-Path $publish 'coreclr.dll'), (Join-Path $publish 'hostfxr.dll'), (Join-Path $publish 'Microsoft.Web.WebView2.Core.dll'))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing published Windows shell component: $required" }
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 64) { throw 'Published EquinoxLocal.exe is unexpectedly small' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) { throw 'Published EquinoxLocal.exe has an invalid PE header offset' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Published EquinoxLocal.exe is not x64 (machine=0x{0:X4})" -f $machine) }
          $loader = Get-ChildItem $publish -Filter WebView2Loader.dll -Recurse | Select-Object -First 1
          if ($null -eq $loader) { throw 'Published shell is missing WebView2Loader.dll' }

      - name: Windows native shell branding smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem native/windows/EquinoxLocal.WindowsShell/bin -Filter EquinoxLocal.exe -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "EquinoxLocal.exe was not built" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if ($null -eq $icon) { throw "EquinoxLocal.exe has no embedded application icon" }
          try {
            if ($icon.Width -lt 16 -or $icon.Height -lt 16) { throw "Embedded Equinox icon is unexpectedly small" }
            $bitmap = $icon.ToBitmap()
            try {
              $pixel = $bitmap.GetPixel([int]($bitmap.Width / 2), [int]($bitmap.Height / 2))
              if ($pixel.A -eq 0) { throw "Embedded Equinox icon center is transparent" }
            } finally { $bitmap.Dispose() }
          } finally { $icon.Dispose() }

      - name: Windows native shell runtime supervision smoke
        shell: pwsh
        run: |
          $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
          dotnet run --project tests/windows/EquinoxLocal.WindowsShell.RuntimeHarness/EquinoxLocal.WindowsShell.RuntimeHarness.csproj --configuration Release

      - name: Windows x64 managed-source runtime acceptance
        shell: pwsh
        run: |
          $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
          dotnet run --project tests/windows/EquinoxLocal.WindowsShell.ManagedSourceHarness/EquinoxLocal.WindowsShell.ManagedSourceHarness.csproj --configuration Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows native shell update handoff smoke
        shell: pwsh
        run: |
          $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
          dotnet run --project tests/windows/EquinoxLocal.WindowsShell.UpdateHandoffHarness/EquinoxLocal.WindowsShell.UpdateHandoffHarness.csproj --configuration Release

      - name: Windows native shell uninstall handoff smoke
        shell: pwsh
        run: |
          $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
          dotnet run --project tests/windows/EquinoxLocal.WindowsShell.UninstallHandoffHarness/EquinoxLocal.WindowsShell.UninstallHandoffHarness.csproj --configuration Release

      - name: Windows native shell startup registration smoke
        run: dotnet run --project tests/windows/EquinoxLocal.WindowsShell.StartupHarness/EquinoxLocal.WindowsShell.StartupHarness.csproj --configuration Release

      - name: Windows native shell folder picker smoke
        run: dotnet run --project tests/windows/EquinoxLocal.WindowsShell.FolderPickerHarness/EquinoxLocal.WindowsShell.FolderPickerHarness.csproj --configuration Release

      - name: Windows native shell presentation smoke
        run: dotnet run --project tests/windows/EquinoxLocal.WindowsShell.PresentationHarness/EquinoxLocal.WindowsShell.PresentationHarness.csproj --configuration Release

  windows-package:
    name: Windows x64 managed package
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish package shell payload
        shell: pwsh
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/windows-shell/win-x64
          EQUINOX_WINDOWS_SHELL_BIN_DIR: ${{ runner.temp }}/windows-shell-bin/win-x64/
          EQUINOX_WINDOWS_SHELL_OBJ_DIR: ${{ runner.temp }}/windows-shell-obj/win-x64/
        run: dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:BaseOutputPath="$env:EQUINOX_WINDOWS_SHELL_BIN_DIR" -p:BaseIntermediateOutputPath="$env:EQUINOX_WINDOWS_SHELL_OBJ_DIR" --output "$env:EQUINOX_WINDOWS_SHELL_PUBLISH_DIR"

      - name: Windows release ZIP security acceptance
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-release-zip-smoke.ps1

      - name: Windows managed package assembly smoke
        shell: pwsh
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/windows-shell/win-x64
        run: |
          npm run local:release:package:windows
          $artifact = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-x64.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Windows managed ZIP artifact was not created' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($artifact.FullName)
          try {
            $names = @($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('release/release.json','release/runtime/node/bin/node.exe','release/runtime/tunnel/tunnel-client.exe','release/runtime/tunnel/cloudflared.exe','release/runtime/browser/equinox-browser-native-host.exe','release/runtime/shell/EquinoxLocal.exe','release/runtime/winapp/winapp.exe','release/runtime/winapp/libHarfBuzzSharp.dll','release/runtime/winapp/libSkiaSharp.dll','release/runtime/winapp/LICENSE')) {
              if ($names -notcontains $required) { throw "Windows managed ZIP is missing $required" }
            }
            if ($names | Where-Object { $_ -like 'release/runtime/peekaboo/*' }) { throw 'Windows managed ZIP unexpectedly contains Peekaboo' }
          } finally { $zip.Dispose() }

      - name: Windows x64 packaged winapp UIA smoke
        shell: pwsh
        run: |
          $fixtureOut = Join-Path $env:RUNNER_TEMP 'equinox-winapp-fixture-x64'
          dotnet publish tests/windows/EquinoxLocal.WinappSmokeFixture/EquinoxLocal.WinappSmokeFixture.csproj --configuration Release --runtime win-x64 --self-contained false -p:Platform=x64 --output $fixtureOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifact = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-x64.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Windows managed ZIP artifact was not found for winapp acceptance' }
          $extract = Join-Path $env:RUNNER_TEMP 'equinox-winapp-x64'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & tar.exe -xf $artifact.FullName -C $extract 'release/runtime/winapp/winapp.exe' 'release/runtime/winapp/libHarfBuzzSharp.dll' 'release/runtime/winapp/libSkiaSharp.dll' 'release/equinox-local-windows-clipboard.ps1' 'release/equinox-local-windows-desktop.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-winapp-smoke.ps1 -WinappPath (Join-Path $extract 'release/runtime/winapp/winapp.exe') -FixturePath (Join-Path $fixtureOut 'EquinoxLocal.WinappSmokeFixture.exe') -ClipboardHelperPath (Join-Path $extract 'release/equinox-local-windows-clipboard.ps1') -DesktopHelperPath (Join-Path $extract 'release/equinox-local-windows-desktop.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-x64-installer:
    name: Windows x64 public installer acceptance
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - parallel:
          - name: Set up Node.js
            uses: actions/setup-node@v7
            with:
              node-version: 26.10.0
              architecture: x64
              cache: npm

          - name: Set up .NET SDK
            uses: actions/setup-dotnet@v6
            with:
              dotnet-version: 10.0.x

      - parallel:
          - name: Install dependencies
            run: npm ci --prefer-offline --no-audit --no-fund

          - name: Publish native x64 shell
            shell: pwsh
            env:
              EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/windows-shell/win-x64
              EQUINOX_WINDOWS_SHELL_BIN_DIR: ${{ runner.temp }}/windows-shell-bin/win-x64/
              EQUINOX_WINDOWS_SHELL_OBJ_DIR: ${{ runner.temp }}/windows-shell-obj/win-x64/
            run: |
              dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:BaseOutputPath="$env:EQUINOX_WINDOWS_SHELL_BIN_DIR" -p:BaseIntermediateOutputPath="$env:EQUINOX_WINDOWS_SHELL_OBJ_DIR" --output "$env:EQUINOX_WINDOWS_SHELL_PUBLISH_DIR"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native x64 managed package
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/windows-shell/win-x64
        run: npm run local:release:package:windows

      - name: Windows x64 real public-installer fresh-install managed-source acceptance
        shell: pwsh
        run: |
          $artifact = Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-x64.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Windows x64 managed ZIP artifact was not found for fresh-install acceptance' }
          $env:EQUINOX_WINDOWS_INSTALL_ARTIFACT = $artifact.FullName
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-real-package-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64-shared-core:
    name: Windows shared core / Node 26
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Windows x64 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64
          cache: npm

      - name: Verify Windows x64 shared-core host
        shell: pwsh
        run: |
          if ((node -p "process.platform") -ne 'win32') { throw 'Windows shared-core lane is not running on Windows' }
          if ((node -p "process.arch") -ne 'x64') { throw 'Windows shared-core lane is not running x64 Node' }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Windows shared core parity suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Architecture-neutral Windows shared logic stays off scarce ARM64 runners; native ARM64 behavior is covered separately.
          # Keep POSIX-only mode/path assertions out of the Windows lane; exact Windows private-state persistence has dedicated ACL acceptance.
          node --test tests/unit/capability-registry.test.js tests/unit/task-capsule-tools.test.js tests/unit/auto-continue-controller.test.js tests/unit/fresh-chat-resume-controller.test.js tests/unit/telegram-chat-bridge-controller.test.js tests/unit/authenticated-http-tools.test.js tests/unit/authenticated-http-response-references.test.js
          node --test tests/unit/task-capsule-store.test.js tests/unit/turn-budget-controller.test.js tests/unit/equinox-local-file-transfer.test.js tests/unit/authenticated-http-integration.test.js
          node --test --test-name-pattern "Telegram defaults follow the shared Windows per-user path contract|Telegram connection input accepts only a token and positive user ID|Telegram message validation is bounded and rejects empty content|command menu sync is a no-op when Telegram is not configured|failed Telegram validation does not persist credentials or expose the token" tests/unit/telegram-integration.test.js
          node --test tests/release/equinox-local-windows-private-state.test.js

  windows-arm64-bootstrap:
    name: Windows bootstrap contract / Node 26
    runs-on: windows-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Windows x64 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: x64

      - name: Verify Windows x64 bootstrap-contract host
        shell: pwsh
        run: |
          if ((node -p "process.platform") -ne 'win32') { throw 'Windows bootstrap contract lane is not running on Windows' }
          if ((node -p "process.arch") -ne 'x64') { throw 'Windows bootstrap contract lane is not running x64 Node' }

      - name: Windows PowerShell bootstrap contract acceptance
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-bootstrap-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Runtime, packaged Desktop/UIA and real installation acceptance are isolated
  # native ARM64 lanes and start together, without a serial artifact dependency.
  windows-arm64-runtime:
    name: Windows ARM64 runtime / Node 26
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up native ARM64 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: arm64
          cache: npm

      - name: Verify native ARM64 Node host
        shell: pwsh
        run: |
          if ((node -p "process.platform") -ne 'win32') { throw 'ARM64 lane is not running on Windows' }
          if ((node -p "process.arch") -ne 'arm64') { throw 'ARM64 lane is not running native ARM64 Node' }
          if ((node --version) -ne 'v26.10.0') { throw 'ARM64 lane Node version drifted' }

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Native CI input success and failure propagation smoke
        shell: pwsh
        run: '& ./tests/release/windows-ci-input-preparation-smoke.ps1'

      - name: Windows ARM64 managed lifecycle plumbing smoke
        run: node --test tests/unit/equinox-local-platform.test.js tests/release/equinox-local-windows-arm64-lifecycle.test.js

      - name: Windows ARM64 headless runtime parity smoke
        run: npm run smoke:windows-headless

      - name: Windows ARM64 uninstall/reinstall lifecycle acceptance
        run: node --test tests/release/equinox-local-windows-lifecycle.test.js

      - name: Windows ARM64 Main native recovery acceptance
        run: node --test tests/release/equinox-local-main-native-windows-acceptance.test.js

      - name: Native ARM64 node-pty / ConPTY smoke
        timeout-minutes: 1
        run: node tests/release/windows-node-pty-smoke.mjs

      - name: Native ARM64 Native Messaging launcher smoke
        run: node tests/release/windows-native-messaging-smoke.mjs

  # Build the exact ARM64 managed ZIP once. Package acceptance and the real
  # public-installer acceptance consume the same verified bytes in parallel.
  windows-arm64-package-build:
    name: Windows ARM64 package build
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      bytes: ${{ steps.package.outputs.bytes }}
      version: ${{ steps.package.outputs.version }}
      target: ${{ steps.package.outputs.target }}
      source_sha: ${{ steps.package.outputs.source_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare native ARM64 CI package
        id: package
        uses: ./.github/actions/prepare-arm64-package

      - name: Verify exact prepared ARM64 CI package bytes
        shell: pwsh
        env:
          EXPECTED_PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          EXPECTED_PACKAGE_BYTES: ${{ steps.package.outputs.bytes }}
        run: |
          $artifacts = @(Get-ChildItem backups/local-packages -Filter 'equinox-local-*-win32-arm64.zip')
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one current-run ARM64 CI package' }
          if ($env:EXPECTED_PACKAGE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:EXPECTED_PACKAGE_BYTES -notmatch '^[1-9][0-9]*$') { throw 'ARM64 package producer metadata is missing or invalid' }
          $sha256 = (Get-FileHash -LiteralPath $artifacts[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -cne $env:EXPECTED_PACKAGE_SHA256 -or $artifacts[0].Length -ne [int64]$env:EXPECTED_PACKAGE_BYTES) { throw 'ARM64 CI package digest or length differs from the producer' }

      - name: Publish exact ARM64 managed ZIP
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-managed-package-${{ github.sha }}
          path: backups/local-packages/equinox-local-*-win32-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows-arm64-package:
    name: Windows ARM64 managed package
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 4
    needs: [windows-arm64-package-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - parallel:
          - name: Set up native ARM64 Node.js
            uses: actions/setup-node@v7
            with:
              node-version: 26.10.0
              architecture: arm64

          - name: Set up .NET SDK
            uses: actions/setup-dotnet@v6
            with:
              dotnet-version: 10.0.x

          - name: Cache NuGet packages
            uses: actions/cache@v6
            with:
              path: ~/.nuget/packages
              key: nuget-${{ runner.os }}-${{ runner.arch }}-dotnet10-${{ hashFiles('native/windows/**/*.csproj', 'tests/windows/**/*.csproj') }}
              restore-keys: |
                nuget-${{ runner.os }}-${{ runner.arch }}-dotnet10-

          - name: Download exact ARM64 managed ZIP
            uses: actions/download-artifact@v7
            with:
              name: windows-arm64-managed-package-${{ github.sha }}
              path: ${{ runner.temp }}/arm64-package

      - name: Verify downloaded ARM64 package identity
        shell: pwsh
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.windows-arm64-package-build.outputs.sha256 }}
          EXPECTED_PACKAGE_BYTES: ${{ needs.windows-arm64-package-build.outputs.bytes }}
        run: |
          $artifacts = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'arm64-package') -Filter 'equinox-local-*-win32-arm64.zip')
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one downloaded ARM64 managed ZIP' }
          if ($artifacts[0].Length -ne [int64]$env:EXPECTED_PACKAGE_BYTES) { throw 'Downloaded ARM64 package length mismatch' }

      - parallel:
          - name: Windows ARM64 stateful shell lifecycle acceptance
            shell: pwsh
            run: |
              $env:EQUINOX_TEST_NODE_EXE = (Get-Command node).Source
              $publish = Join-Path $PWD 'artifacts/windows-uninstall-handoff/win-arm64'
              dotnet publish tests/windows/EquinoxLocal.WindowsShell.UninstallHandoffHarness/EquinoxLocal.WindowsShell.UninstallHandoffHarness.csproj --configuration Release --runtime win-arm64 --self-contained true -p:Platform=ARM64 --output $publish
              & (Join-Path $publish 'EquinoxLocal.WindowsShell.UninstallHandoffHarness.exe')
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              dotnet run --project tests/windows/EquinoxLocal.WindowsShell.ManagedSourceHarness/EquinoxLocal.WindowsShell.ManagedSourceHarness.csproj --configuration Release -p:Platform=ARM64
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          - name: Windows ARM64 packaged node-pty / ConPTY smoke
            shell: pwsh
            run: |
              $artifact = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'arm64-package') -Filter 'equinox-local-*-win32-arm64.zip' | Select-Object -First 1
              if ($null -eq $artifact) { throw 'Windows ARM64 managed ZIP artifact was not found for node-pty acceptance' }
              $extract = Join-Path $env:RUNNER_TEMP 'equinox-node-pty-arm64'
              New-Item -ItemType Directory -Path $extract -Force | Out-Null
              & tar.exe -xf $artifact.FullName -C $extract 'release/node_modules/node-pty'
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $env:EQUINOX_WINDOWS_NODE_PTY_ROOT = Join-Path $extract 'release/node_modules/node-pty'
              node tests/release/windows-node-pty-smoke.mjs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          - name: Windows ARM64 packaged winapp UIA smoke
            shell: pwsh
            run: |
              $fixtureOut = Join-Path $env:RUNNER_TEMP 'equinox-winapp-fixture-arm64'
              dotnet publish tests/windows/EquinoxLocal.WinappSmokeFixture/EquinoxLocal.WinappSmokeFixture.csproj --configuration Release --runtime win-arm64 --self-contained false -p:Platform=ARM64 --output $fixtureOut
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $artifact = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'arm64-package') -Filter 'equinox-local-*-win32-arm64.zip' | Select-Object -First 1
              if ($null -eq $artifact) { throw 'Windows ARM64 managed ZIP artifact was not found for winapp acceptance' }
              $extract = Join-Path $env:RUNNER_TEMP 'equinox-winapp-arm64'
              New-Item -ItemType Directory -Path $extract -Force | Out-Null
              & tar.exe -xf $artifact.FullName -C $extract 'release/runtime/winapp/winapp.exe' 'release/runtime/winapp/libHarfBuzzSharp.dll' 'release/runtime/winapp/libSkiaSharp.dll' 'release/equinox-local-windows-clipboard.ps1' 'release/equinox-local-windows-desktop.ps1'
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-winapp-smoke.ps1 -WinappPath (Join-Path $extract 'release/runtime/winapp/winapp.exe') -FixturePath (Join-Path $fixtureOut 'EquinoxLocal.WinappSmokeFixture.exe') -ClipboardHelperPath (Join-Path $extract 'release/equinox-local-windows-clipboard.ps1') -DesktopHelperPath (Join-Path $extract 'release/equinox-local-windows-desktop.ps1')
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64-installer:
    name: Windows ARM64 public installer acceptance
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 7
    needs: [windows-arm64-package-build]

    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@v7

          - name: Download exact ARM64 managed ZIP
            uses: actions/download-artifact@v7
            with:
              name: windows-arm64-managed-package-${{ github.sha }}
              path: ${{ runner.temp }}/arm64-package

      - name: Verify and run ARM64 real public-installer fresh-install acceptance
        shell: pwsh
        env:
          EQUINOX_WINDOWS_INSTALL_SHA256: ${{ needs.windows-arm64-package-build.outputs.sha256 }}
          EQUINOX_WINDOWS_INSTALL_BYTES: ${{ needs.windows-arm64-package-build.outputs.bytes }}
          EQUINOX_WINDOWS_INSTALL_VERSION: ${{ needs.windows-arm64-package-build.outputs.version }}
          EQUINOX_WINDOWS_INSTALL_TARGET: ${{ needs.windows-arm64-package-build.outputs.target }}
          EQUINOX_WINDOWS_INSTALL_SOURCE_SHA: ${{ needs.windows-arm64-package-build.outputs.source_sha }}
        run: |
          $artifact = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'arm64-package') -Filter 'equinox-local-*-win32-arm64.zip' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Windows ARM64 managed ZIP artifact was not found for fresh-install acceptance' }
          if ($artifact.Length -ne [int64]$env:EQUINOX_WINDOWS_INSTALL_BYTES) { throw 'Downloaded ARM64 installer package length mismatch' }
          $env:EQUINOX_WINDOWS_INSTALL_ARTIFACT = $artifact.FullName
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/release/windows-installer-real-package-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64-foundation:
    name: Windows ARM64 foundation / Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [windows-arm64-runtime, windows-arm64-package, windows-arm64-installer]

    steps:
      - name: Verify parallel native ARM64 acceptance
        env:
          ARM64_RUNTIME_RESULT: ${{ needs.windows-arm64-runtime.result }}
          ARM64_PACKAGE_RESULT: ${{ needs.windows-arm64-package.result }}
          ARM64_INSTALLER_RESULT: ${{ needs.windows-arm64-installer.result }}
        run: |
          test "$ARM64_RUNTIME_RESULT" = success
          test "$ARM64_PACKAGE_RESULT" = success
          test "$ARM64_INSTALLER_RESULT" = success

  windows-headless:
    name: Windows x64 headless / Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [windows-runtime, windows-shell, windows-package, windows-x64-installer, windows-arm64-shared-core, windows-arm64-bootstrap, windows-arm64-foundation]

    steps:
      - name: Verify parallel Windows acceptance
        env:
          RUNTIME_RESULT: ${{ needs.windows-runtime.result }}
          SHELL_RESULT: ${{ needs.windows-shell.result }}
          PACKAGE_RESULT: ${{ needs.windows-package.result }}
          X64_INSTALLER_RESULT: ${{ needs.windows-x64-installer.result }}
          ARM64_SHARED_RESULT: ${{ needs.windows-arm64-shared-core.result }}
          ARM64_BOOTSTRAP_RESULT: ${{ needs.windows-arm64-bootstrap.result }}
          ARM64_RESULT: ${{ needs.windows-arm64-foundation.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$SHELL_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$X64_INSTALLER_RESULT" = success
          test "$ARM64_SHARED_RESULT" = success
          test "$ARM64_BOOTSTRAP_RESULT" = success
          test "$ARM64_RESULT" = success

  main-native-plan:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.main_native_current != '' && inputs.main_native_target != '' }}
    name: Exact-SHA Main snapshot plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main-update-impact: ${{ steps.plan.outputs.main-update-impact }}
      native-impact: ${{ steps.plan.outputs.native-impact }}
      target-sha: ${{ steps.plan.outputs.target-sha }}
      github-count: ${{ steps.plan.outputs.github-count }}
      github-matrix: ${{ steps.plan.outputs.github-matrix }}
    steps:
      - name: Checkout workflow implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refresh canonical main ref
        shell: bash
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0

      - name: Plan exact-SHA native artifacts
        id: plan
        shell: bash
        env:
          CURRENT_SHA: ${{ github.event_name == 'push' && github.event.before || inputs.main_native_current }}
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.main_native_target }}
        run: |
          plan_file="$RUNNER_TEMP/main-native-plan.json"
          node scripts/release/plan-main-native-artifacts.mjs --current-sha "$CURRENT_SHA" --target-sha "$TARGET_SHA" > "$plan_file"
          cat "$plan_file"
          PLAN_FILE="$plan_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan = JSON.parse(fs.readFileSync(process.env.PLAN_FILE, 'utf8'));
          const lines = [
            `main-update-impact=${plan.mainUpdateImpact}`,
            `native-impact=${plan.nativeImpact}`,
            `target-sha=${plan.targetSha}`,
            `github-count=${plan.githubTargets.length}`,
            `github-matrix=${JSON.stringify({ include: plan.githubTargets })}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join('\n')}\n`);
          NODE

      - name: Upload exact-SHA build plan
        uses: actions/upload-artifact@v7
        with:
          name: main-native-plan-${{ steps.plan.outputs.target-sha }}
          path: ${{ runner.temp }}/main-native-plan.json
          if-no-files-found: error
          retention-days: 14

  main-native-build:
    needs: main-native-plan
    if: ${{ needs.main-native-plan.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.main-native-plan.outputs.main-update-impact == 'true') }}
    name: Main ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.main-native-plan.outputs.github-matrix) }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-native-plan.outputs.target-sha }}
          fetch-depth: 0

      - name: Verify exact target SHA
        shell: bash
        if: ${{ matrix.platform == 'darwin' }}
        run: test "$(git rev-parse HEAD)" = "${{ needs.main-native-plan.outputs.target-sha }}"

      - name: Verify exact target SHA on Windows
        shell: pwsh
        if: ${{ matrix.platform == 'win32' }}
        run: |
          if ((git rev-parse HEAD) -ne '${{ needs.main-native-plan.outputs.target-sha }}') { throw 'Main native builder checked out the wrong target SHA' }

      - name: Set up native Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Verify native host target
        run: |
          node -e "const expected='${{ matrix.target }}'; const actual=process.platform+'-'+process.arch; if(actual!==expected) throw new Error('Native host drift: '+actual+' != '+expected)"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Set up .NET SDK
        if: ${{ matrix.platform == 'win32' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows native shell payload
        if: ${{ matrix.platform == 'win32' }}
        shell: pwsh
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/windows-shell/${{ matrix.shellRid }}
          EQUINOX_WINDOWS_SHELL_BIN_DIR: ${{ runner.temp }}/windows-shell-bin/${{ matrix.shellRid }}/
          EQUINOX_WINDOWS_SHELL_OBJ_DIR: ${{ runner.temp }}/windows-shell-obj/${{ matrix.shellRid }}/
        run: |
          dotnet publish native/windows/EquinoxLocal.WindowsShell/EquinoxLocal.WindowsShell.csproj --configuration Release --runtime '${{ matrix.shellRid }}' --self-contained true -p:Platform='${{ matrix.dotnetPlatform }}' -p:BaseOutputPath="$env:EQUINOX_WINDOWS_SHELL_BIN_DIR" -p:BaseIntermediateOutputPath="$env:EQUINOX_WINDOWS_SHELL_OBJ_DIR" --output "$env:EQUINOX_WINDOWS_SHELL_PUBLISH_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git status --porcelain=v1 --untracked-files=all)) { throw 'Windows native shell publish dirtied the exact-SHA checkout' }

      - name: Build exact-SHA Main native artifact
        env:
          EQUINOX_WINDOWS_SHELL_PUBLISH_DIR: ${{ runner.temp }}/windows-shell/${{ matrix.shellRid }}
        run: node scripts/release/build-main-native-artifact.mjs --source-sha "${{ needs.main-native-plan.outputs.target-sha }}" --target "${{ matrix.target }}"

      - name: Upload exact-SHA Main native candidate
        uses: actions/upload-artifact@v7
        with:
          name: main-native-${{ needs.main-native-plan.outputs.target-sha }}-${{ matrix.target }}
          path: artifacts/main-native/*
          if-no-files-found: error
          retention-days: 14

  main-native-result:
    needs: [main-native-plan, main-native-build]
    if: ${{ always() && needs.main-native-plan.result != 'skipped' }}
    name: Main snapshot candidate result
    runs-on: ubuntu-latest
    steps:
      - name: Enforce GitHub-native build result
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
          MAIN_UPDATE_IMPACT: ${{ needs.main-native-plan.outputs.main-update-impact }}
          NATIVE_IMPACT: ${{ needs.main-native-plan.outputs.native-impact }}
          GITHUB_COUNT: ${{ needs.main-native-plan.outputs.github-count }}
          GITHUB_RESULT: ${{ needs.main-native-build.result }}
        shell: bash
        run: |
          if [ "$MAIN_UPDATE_IMPACT" != "true" ] && [ "$FORCE_BUILD" != "true" ]; then
            if [ "$GITHUB_RESULT" != "skipped" ]; then
              echo "Non-product Main change unexpectedly ran native snapshot builds; result=$GITHUB_RESULT" >&2
              exit 1
            fi
            echo "No user-visible Main update: changed paths are limited to tests/CI/docs metadata." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_COUNT" != "4" ] || [ "$GITHUB_RESULT" != "success" ]; then
            echo "Exact-SHA Main snapshot requires four successful GitHub-native builds; count=$GITHUB_COUNT result=$GITHUB_RESULT" >&2
            exit 1
          fi
          {
            echo "## Main snapshot candidate validation"
            echo "- Native impact since previous Main: $NATIVE_IMPACT"
            echo "- Exact-SHA snapshot target count: $GITHUB_COUNT"
            echo "- All four Main snapshot targets are built on GitHub; no factory host is required."
            echo ""
            echo "Main Snapshot is a moving pre-release channel. Numbered Stable releases remain deliberate fresh-install/checkpoint baselines."
          } >> "$GITHUB_STEP_SUMMARY"

  main-snapshot-publish:
    needs: [test, macos-managed-source, macos-x64, windows-headless, main-native-plan, main-native-build, main-native-result]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.macos-managed-source.result == 'success' && needs.macos-x64.result == 'success' && needs.windows-headless.result == 'success' && needs.main-native-plan.outputs.main-update-impact == 'true' && needs.main-native-result.result == 'success' }}
    name: Publish Main Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: equinox-local-main-snapshot-publish
      cancel-in-progress: false
    steps:
      - name: Confirm this run still owns latest Main
        id: latest
        shell: bash
        env:
          TARGET_SHA: ${{ needs.main-native-plan.outputs.target-sha }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | awk '{print $1}')"
          if [ "$latest" = "$TARGET_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Main snapshot $TARGET_SHA; canonical main is $latest." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download exact-SHA snapshot candidates
        if: ${{ steps.latest.outputs.publish == 'true' }}
        uses: actions/download-artifact@v7
        with:
          pattern: main-native-${{ needs.main-native-plan.outputs.target-sha }}-*
          path: ${{ runner.temp }}/main-snapshot
          merge-multiple: true

      - name: Validate complete exact-SHA snapshot set
        if: ${{ steps.latest.outputs.publish == 'true' }}
        shell: bash
        env:
          TARGET_SHA: ${{ needs.main-native-plan.outputs.target-sha }}
          SNAPSHOT_DIR: ${{ runner.temp }}/main-snapshot
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 win32-arm64 win32-x64; do
            manifest="$SNAPSHOT_DIR/equinox-local-main-$TARGET_SHA-$target.json"
            if [[ "$target" == darwin-* ]]; then extension='.tar.gz'; else extension='.zip'; fi
            artifact="$SNAPSHOT_DIR/equinox-local-main-$TARGET_SHA-$target$extension"
            test -f "$manifest"
            test -f "$artifact"
          done
          count="$(find "$SNAPSHOT_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = 8

      - name: Publish exact-SHA snapshot objects to public R2
        if: ${{ steps.latest.outputs.publish == 'true' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EQUINOX_MAIN_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EQUINOX_MAIN_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: '8'
          TARGET_SHA: ${{ needs.main-native-plan.outputs.target-sha }}
          SNAPSHOT_DIR: ${{ runner.temp }}/main-snapshot
          R2_ENDPOINT: https://c1ff8ccffcbffe46094cd3a2729a1c1f.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}"
          test -n "${AWS_SECRET_ACCESS_KEY:-}"
          aws --version
          for object in "$SNAPSHOT_DIR"/*; do
            name="$(basename "$object")"
            aws s3api put-object \
              --bucket equinox-local-main \
              --key "snapshots/$TARGET_SHA/$name" \
              --body "$object" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control 'public,max-age=31536000,immutable' \
              >/dev/null
          done

      - name: Verify public snapshot before moving tag
        if: ${{ steps.latest.outputs.publish == 'true' }}
        shell: bash
        env:
          TARGET_SHA: ${{ needs.main-native-plan.outputs.target-sha }}
          PUBLIC_BASE: https://main.local.sametbasbug.dev
        run: |
          set -euo pipefail
          latest="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | awk '{print $1}')"
          test "$latest" = "$TARGET_SHA"
          for target in darwin-arm64 darwin-x64 win32-arm64 win32-x64; do
            manifest="equinox-local-main-$TARGET_SHA-$target.json"
            if [[ "$target" == darwin-* ]]; then extension='.tar.gz'; else extension='.zip'; fi
            artifact="equinox-local-main-$TARGET_SHA-$target$extension"
            manifest_url="$PUBLIC_BASE/snapshots/$TARGET_SHA/$manifest"
            artifact_url="$PUBLIC_BASE/snapshots/$TARGET_SHA/$artifact"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --output "$RUNNER_TEMP/$manifest" "$manifest_url"
            jq -e --arg sha "$TARGET_SHA" --arg target "$target" '.sourceSha == $sha and .target == $target' "$RUNNER_TEMP/$manifest" >/dev/null
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --range 0-0 --output /dev/null "$artifact_url"
          done

      - name: Move tag-only Main Snapshot pointer
        if: ${{ steps.latest.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.main-native-plan.outputs.target-sha }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          latest="$(git ls-remote https://github.com/$repo.git refs/heads/main | awk '{print $1}')"
          test "$latest" = "$TARGET_SHA"
          if gh api "/repos/$repo/git/ref/tags/main-snapshot" >/dev/null 2>&1; then
            gh api --method PATCH "/repos/$repo/git/refs/tags/main-snapshot" -f sha="$TARGET_SHA" -F force=true >/dev/null
          else
            gh api --method POST "/repos/$repo/git/refs" -f ref='refs/tags/main-snapshot' -f sha="$TARGET_SHA" >/dev/null
          fi
          echo "Published public exact-SHA Main snapshot objects for $TARGET_SHA and moved tag-only main-snapshot. No GitHub Release was created." >> "$GITHUB_STEP_SUMMARY"
