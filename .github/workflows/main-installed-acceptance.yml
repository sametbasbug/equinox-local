name: Main Installed Upgrade Acceptance

# Expensive, isolated real native-host smoke. It is deliberately not part of
# the routine PR/push gate, and never runs on a developer's Mac mini.
on:
  workflow_dispatch:
    inputs:
      previous_main_sha:
        description: Exact previously admitted Main SHA to install as A
        required: true
        default: e6f5fa6e1d264c233c94c4e87097e53b9bb6288a
        type: string
      architecture:
        description: Native macOS host architecture
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
      expected_native_mode:
        description: Require genuine native transition mode (default preserves previous smoke)
        required: true
        default: reuse_native
        type: choice
        options:
          - reuse_native
          - artifact_required
      scenario:
        description: Native installed-host path to accept
        required: true
        default: positive
        type: choice
        options:
          - positive
          - target-health-failure

permissions:
  contents: read

concurrency:
  group: main-installed-acceptance
  cancel-in-progress: false

jobs:
  macos-native:
    name: macOS ${{ inputs.architecture }} real installed A-to-Main upgrade
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-latest' }}
    timeout-minutes: 25
    env:
      OLD_SHA: ${{ inputs.previous_main_sha }}
      EXPECTED_REPOSITORY: sametbasbug/equinox-local
    steps:
      - name: Checkout current canonical product
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: npm

      - name: Check isolated runner and admitted snapshot SHA
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform + "/" + process.arch')" = 'darwin/${{ inputs.architecture }}'
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          [[ "$OLD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$OLD_SHA^{commit}"
          current="$(git rev-parse HEAD)"
          tag="$(git ls-remote origin refs/tags/main-snapshot | cut -f1)"
          [[ "$tag" =~ ^[a-f0-9]{40}$ ]]
          # Allow iterating this test-only harness on an opt-in branch without
          # rerunning four native package builds. Executable production inputs
          # must still be the separately admitted immutable snapshot. Refuse
          # arbitrary unadmitted source changes between the tag and checkout.
          git merge-base --is-ancestor "$tag" "$current"
          while IFS= read -r changed; do
            case "$changed" in
              '.github/workflows/main-installed-acceptance.yml'|'tests/release/smoke-main-upgrade-macos.mjs'|'tests/release/equinox-local-main-native-activation.test.js'|\
              '.github/workflows/main-installed-windows-acceptance.yml'|'tests/release/smoke-main-upgrade-windows.mjs'|\
              'tests/release/smoke-main-upgrade-windows-fault.ps1'|'tests/release/windows-installer-real-package-smoke.ps1') ;;
              *) echo "Unadmitted production change in harness checkout: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$tag" "$current")
          test "$OLD_SHA" != "$tag"
          git merge-base --is-ancestor "$OLD_SHA" "$tag"
          echo "target_sha=$tag" >> "$GITHUB_OUTPUT"

      - name: Build previously admitted A release in an ephemeral runner worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/equinox-old-main" "$OLD_SHA"
          cd "$RUNNER_TEMP/equinox-old-main"
          npm ci --prefer-offline --no-audit --no-fund
          npm run local:release:package
          artifact="backups/local-packages/equinox-local-5.2.1-darwin-${{ inputs.architecture }}.tar.gz"
          test -s "$artifact"
          echo "OLD_RELEASE_ARTIFACT=$PWD/$artifact" >> "$GITHUB_ENV"

      - name: Install old Main A and run actual LaunchAgent Control Center upgrade to admitted B
        shell: bash
        env:
          TARGET_SHA: ${{ steps.identity.outputs.target_sha }}
          M8_ACCEPTANCE_SCENARIO: ${{ inputs.scenario }}
          M8_EXPECTED_NATIVE_MODE: ${{ inputs.expected_native_mode }}
          # Scoped, ephemeral Actions read credential; consumed only by the
          # disposable runner's pinned github.com discovery preload, not a
          # default product runtime config or any release artifact.
          M8_GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tests/release/smoke-main-upgrade-macos.mjs "$OLD_RELEASE_ARTIFACT" "$OLD_SHA" "$TARGET_SHA"
