name: Prune Main R2 snapshots

on:
  workflow_dispatch:
  # Run after the complete signed Main CI pipeline, not during publication.
  # The daily run is a fallback for cancelled/failed or missed event deliveries.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: equinox-local-main-snapshot-publish
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    name: Retain safe Main snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.EQUINOX_MAIN_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EQUINOX_MAIN_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '8'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      - name: Preflight R2 inventory and protected Main references
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}"
          test -n "${AWS_SECRET_ACCESS_KEY:-}"
          aws --version
          node scripts/release/prune-main-r2.mjs
      - name: Prune obsolete exact-SHA archives after revalidating Main references
        run: node scripts/release/prune-main-r2.mjs --apply
