name: ✨ Feature idea
description: Suggest a new capability or usability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem** and desired experience rather than prescribing implementation. Equinox Local supports macOS/Windows and keeps browser/agent permissions explicit.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Control Center / usability
        - Equinox Browser
        - Tasks / Telegram
        - Terminal / desktop automation
        - Installation / updates
        - Documentation / onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What would the ideal experience look like?
      description: A brief example or user story is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or related tools
      description: Optional. What have you tried?
  - type: textarea
    id: boundaries
    attributes:
      label: Permissions or privacy considerations
      description: Optional. Should an action require confirmation, specific consent or an opt-in?
