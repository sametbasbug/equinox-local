name: 🐛 Bug report
description: Report a reproducible Equinox Local or Equinox Browser problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! **Do not paste API keys, tokens, private file contents, account identifiers or unredacted logs.** For vulnerabilities, use [private security reporting](https://github.com/sametbasbug/equinox-local/security/advisories/new).
  - type: dropdown
    id: component
    attributes:
      label: Which part?
      options:
        - Equinox Local / Control Center
        - Equinox Browser (Chrome extension)
        - Telegram / Task Capsules
        - Installer / updates
        - Terminal / desktop automation
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system & architecture
      options:
        - macOS (Apple silicon / ARM64)
        - macOS (Intel / x64)
        - Windows (ARM64)
        - Windows (x64)
        - Not sure / does not apply
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Equinox Local Stable version or Main version + short SHA; add Browser version when relevant.
      placeholder: "Equinox Local 6.0.0 (Stable), Browser 1.0.0"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include any error message, with private details removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics
      description: Share redacted System Doctor output, screenshots or logs (no credentials, chat transcripts or private paths).
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, secrets and personal information from this report.
          required: true
