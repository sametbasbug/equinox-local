<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
  <title>Equinox Local — Connection unavailable</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101018; color: #f1f1f7; }
    main { max-width: 430px; padding: 38px; text-align: center; }
    .mark { width: 52px; height: 52px; margin: 0 auto 28px; display: grid; place-items: center; border-radius: 16px; background: #27203d; color: #c6afff; font-size: 27px; }
    h1 { font-size: 25px; letter-spacing: -.6px; margin: 0 0 14px; }
    p { line-height: 1.6; color: #b7b6c5; }
    a { display: inline-block; margin-top: 16px; padding: 12px 23px; border-radius: 12px; color: #181126; background: #c9b8ff; text-decoration: none; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">E</div>
    <h1>Connecting to Equinox Local</h1>
    <p>The local runtime is not available yet. Start your existing Equinox Local service, then reconnect. Your settings and tasks stay where they are.</p>
    <a href="http://127.0.0.1:24891/">Try again</a>
  </main>
</body>
</html>
